[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kds-terminology-watch"
version = "0.1.0"
description = "Watch SNOMED CT and LOINC releases for their impact on MII KDS ValueSets (baseline + compare + report)"
requires-python = ">=3.9"
license = {text = "CC-BY-4.0"}
dependencies = []

[project.scripts]
termwatch = "termwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
